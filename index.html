<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samir Game Store | 13.52</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --gs-gold: #FFD700; --gs-dark: #0a0a0a; --gs-gray: #1f1f1f; --gs-glow: rgba(255, 215, 0, 0.4); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; background: #000; color: #fff; font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden; }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 0%, #332b00 0%, transparent 60%); z-index: 0; }
  .hud-container { position: relative; z-index: 1; width: 95%; max-width: 850px; background: var(--gs-dark); border: 1px solid #333; border-top: 4px solid var(--gs-gold); border-radius: 12px; padding: 40px 30px; box-shadow: 0 20px 50px rgba(0,0,0,1), 0 0 40px var(--gs-glow); text-align: center; }
  .brand-title { font-family: 'Orbitron', sans-serif; font-size: 5.5rem; font-weight: 900; letter-spacing: 4px; color: var(--gs-gold); text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); direction: ltr; margin-bottom: 0; }
  .brand-sub { font-size: 1.5rem; color: #fff; font-weight: 700; letter-spacing: 1px; margin-bottom: 30px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
  .contact-info { background: var(--gs-gray); border-radius: 8px; padding: 20px; margin-bottom: 30px; border: 1px solid #333; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
  .address { font-size: 1.2rem; color: #ddd; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 15px; }
  .address span { color: var(--gs-gold); margin-left: 5px; }
  .phones { direction: ltr; font-family: 'Orbitron', sans-serif; font-size: 1.6rem; color: var(--gs-gold); font-weight: bold; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
  .status-panel { background: #000; padding: 20px; border-radius: 8px; border: 1px solid #222; border-right: 4px solid var(--gs-gold); }
  #state { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 10px; direction: ltr; text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); }
  #det { font-size: 16px; color: #aaa; line-height: 1.8; direction: ltr; }
  #det b { color: var(--gs-gold); font-family: 'Orbitron', sans-serif; }
  #cache { font-size: 14px; color: #555; margin-top: 15px; font-family: 'Orbitron', sans-serif; direction: ltr; }
  #cache.cacheok { color: #00ff66; text-shadow: 0 0 8px #00ff66; }
  .ok { color: var(--gs-gold); } .bad { color: #ff3333; }
  .footer { position: fixed; bottom: 15px; right: 20px; font-family: 'Orbitron', sans-serif; font-size: 12px; color: rgba(255,255,255,0.2); direction: ltr; letter-spacing: 1px; }
  @media (max-width: 600px) { .brand-title { font-size: 3.5rem; } .brand-sub { font-size: 1.2rem; } .hud-container { padding: 30px 15px; } .address { font-size: 1rem; } .phones { font-size: 1.2rem; } }
</style>
</head>
<body>
<div class="hud-container">
  <h1 class="brand-title">Samir Game Store</h1>
  <div class="brand-sub">م/Samir Abo Adam</div>
  <div class="contact-info">
    <div class="address"><span>📍</span> مول دايمواند 6 اكتوبر الدور الاول</div>
    <div><span style="color:var(--gs-gold); font-weight:bold;">📞 للتواصل:</span><br><div class="phones">01144886660 * 01011700115</div></div>
  </div>
  <div class="status-panel">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
</div>
<div class="footer">Samie Game Store 13.52 HOST</div>
<script>
const fw = (navigator.userAgent.match(/PlayStation 4 ([0-9]+\\.[0-9]+)/) || ["", "13.52"])[1];
const asN = parseFloat(fw);
let rfw = fw;
if(asN >= 13.00 && asN <= 13.49) {
    rfw = "13.00";
}

function setCache(s, isok) {
    const el = document.getElementById("cache");
    if(!el) return;
    el.innerHTML = s;
    if(isok) el.className = "cacheok";
}

function waitForTap(msg, cb) {
    const el = document.getElementById("cache");
    el.innerHTML = "<b>" + msg + "</b>";
    el.className = "cacheok";
    window.addEventListener("click", cb, {once: true});
    window.addEventListener("keydown", function(e) {
        if(e.keyCode === 13 || e.keyCode === 32 || e.keyCode === 120 /* 'x' button mapping if any */) {
            window.removeEventListener("click", cb);
            cb();
        }
    }, {once: true});
}

function go() {
    location.href = "jb.html";
}

(function() {
    const ac = window.applicationCache;
    if(!ac) {
        setCache("no appcache, ready to run", true);
        waitForTap("READY (no cache) -- press X or tap to load & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
